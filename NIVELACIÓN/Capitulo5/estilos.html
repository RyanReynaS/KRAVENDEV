<!DOCTYPE html>
<!--
    ARCHIVO: estilos.html
    PROPÓSITO: Página que muestra 3 logos de plataformas de streaming con estilos CSS
    Demuestra uso de clases CSS para estilizar elementos
-->
<html>
    <head>
        <!-- Importa el archivo de estilos CSS -->
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>
        <!-- Título principal -->
        <div>
            <div class="tit">Cual es la mejor plataforma</div>
        </div>

        <!-- Contenedor para las imágenes de las plataformas -->
        <div class="contenedorImagenes">
            <!-- Logo de Netflix -->
            <div class="contenedorImagen"><img src="netflix_logo.jpg" class="netflix"></div>
            <!-- Logo de Prime Video -->
            <div class="contenedorImagen"><img src="primeLogo.jpg" class="prime"></div>
            <!-- Logo de Disney+ -->
            <div class="contenedorImagen"><img src="disneyLogo.jpg" class="disney"></div>
        </div>
    </body>
</html>
