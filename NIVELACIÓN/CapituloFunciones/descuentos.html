<!DOCTYPE html>
<html>

    <head>
    <script src="descuentos.js"></script>
    </head>

    <body>
       <!-- Monto original a pagar -->
       <h2>Ingrese el monto a pagar</h2>
       <input type="text" id="txtMonto">
       <!-- Porcentaje de descuento -->
       <h2>Ingrese el descuento</h2>
       <input type="text" id="txtDescuento">
       <!-- Botón que calcula con descuento -->
      <p><input type="button" value="Valor a Pagar" onclick="descontar()"></p>
       <!-- Resultado final -->
       <h2>Valor a pagar</h2>
       <h2 id="lblTotal">0</h2>
    </body>

</html>
