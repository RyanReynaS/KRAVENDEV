<!DOCTYPE html>
<!--
    ====================================
    ARCHIVO: robot1.html
    PROPÓSITO: Página HTML para controlar el Robot 1 (explosión del robot)
    Importa funcionesRobot1.js y proporciona un botón para explotar el robot
    ====================================
-->
<html>
    <head>
        <!--
            Importa el archivo con las funciones del robot
            NOTA: El atributo src menciona "funcionesRobot.js" pero debería ser "funcionesRobot1.js"
            Si funcionesRobot.js no existe, el botón no funcionará correctamente

            EXPLICACIÓN DEL ERROR:
            - Se intenta cargar "funcionesRobot.js" (sin número)
            - Pero el archivo real es "funcionesRobot1.js" (con número 1)
            - Esto es un error común: la ruta del archivo no coincide con el nombre real del archivo
        -->
        <script src="funcionesRobot.js"/>
    </head>
    <body>
        <!--
            Botón que ejecuta la función explotar()
            onclick="explotar();" hace lo siguiente:
            1. Busca la función explotar() (definida en funcionesRobot.js)
            2. La ejecuta, mostrando una alerta de explosión

            El botón muestra el texto "EXPLOTAR" en la interfaz
        -->
        <input type="button" value="EXPLOTAR" onclick="explotar();"/>
    </body>
</html>
