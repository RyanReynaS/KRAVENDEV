<!DOCTYPE html>
<!--
    ====================================
    ARCHIVO: robot3.html (VERSIÓN CORREGIDA)
    PROPÓSITO: Página HTML para controlar el Robot 3 (con dos botones: explotar y eliminar)
    Esta es la versión corregida del archivo con errores
    ====================================
-->
<html>
    <head>
        <!--
            Importa el archivo funcionesRobot3.js
            Este archivo contiene:
            - La función autoeliminar() (definida al nivel superior)
            - Dentro de autoeliminar(), se define la función explotar()

            Por lo tanto:
            - autoeliminar() está disponible desde el inicio
            - explotar() solo está disponible DESPUÉS de que autoeliminar() haya sido ejecutada
        -->
        <script src="funcionesRobot3.js"></script>
    </head>
    <body>
        <!--
            Botón 1: "EXPLOTAR"
            onclick="explotar();" ejecuta la función explotar()

            NOTA IMPORTANTE SOBRE EL COMPORTAMIENTO:
            - explotar() se define DENTRO de autoeliminar()
            - Para que este botón funcione, debes hacer clic en ELIMINAR primero
            - Si haces clic en EXPLOTAR antes de ELIMINAR, obtendrás un error
            - Una vez que has hecho clic en ELIMINAR, explotar() estará disponible
            - Luego podrás hacer clic en EXPLOTAR sin problemas
        -->
        <input type="button" value="EXPLOTAR" onclick="explotar();"/>

        <!--
            Botón 2: "ELIMINAR"
            onclick="autoeliminar();" ejecuta la función autoeliminar()

            Esta función:
            1. Muestra un mensaje: "El robot ha sido eliminado"
            2. Define la función explotar() para futuras llamadas

            Este botón debe presionarse PRIMERO para que explotar() esté disponible
            Después de hacer clic aquí, el botón EXPLOTAR funcionará correctamente
        -->
        <input type="button" value="ELIMINAR" onclick="autoeliminar();"/>
    </body>
</html>
