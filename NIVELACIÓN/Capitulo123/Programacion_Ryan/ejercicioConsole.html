<!DOCTYPE html>
<!--
    ====================================
    ARCHIVO: ejercicioConsole.html
    PROPÓSITO: Página HTML que demuestra cómo usar console.log() para imprimir mensajes en la consola del navegador
    A diferencia de alert(), console.log() no muestra una ventana emergente, sino un mensaje en la consola del desarrollador
    ====================================
-->
<html>
    <head>
        <!-- Título que aparece en la pestaña del navegador -->
        <title>CONSOLA</title>
    </head>
    <body>
        <!-- Encabezado que instruye al usuario a hacer clic -->
        <h1>PRESIONAME</h1>

        <!--
            Botón que ejecuta console.log() cuando se hace clic
            onclick="console.log('Hola, no soy un virus');" hace lo siguiente:
            - Ejecuta la función console.log()
            - Imprime el mensaje en la consola del navegador (no en una ventana emergente)
            - El mensaje no es visible para el usuario a menos que abra la consola del desarrollador

            Diferencia entre alert() y console.log():
            - alert(): muestra una ventana emergente que interrumpe la experiencia del usuario
            - console.log(): imprime en la consola del navegador (panel de desarrollador)

            Cómo ver el resultado:
            1. Abre el navegador
            2. Presiona F12 o Ctrl+Shift+J para abrir la consola del desarrollador
            3. Haz clic en el botón
            4. En la consola verás el mensaje: "Hola, no soy un virus"

            Si cambias el texto en console.log():
            Por ejemplo: console.log('Este es mi primer mensaje');
            Verás ese mensaje diferente en la consola
        -->
        <input type="button" value="OK" onclick="console.log('Hola, no soy un virus');"/>
    </body>
</html>
